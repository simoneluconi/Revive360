# Revive360: load our shim into the stock camera app (camera/shim/g360r_shim.c).
# It only remembers the app's camera handle, logs the capture settings the app
# makes and, on request from g360rd, makes the same calls the app makes (RAW).
# Remove this file (or reflash stock) to run the app without it.
[Service]
Environment=LD_PRELOAD=/usr/lib/libg360r_shim.so
